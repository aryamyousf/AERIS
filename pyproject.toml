[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris-rul"
version = "0.1.0"
description = "NASA FD001 remaining-useful-life analysis and modeling project"
requires-python = ">=3.10"
dependencies = [
    "gdown",
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["src"]
